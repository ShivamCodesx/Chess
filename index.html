<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Chess</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { 
            background: #262421; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }

        #myBoard { width: 95vw; max-width: 450px; }

        /* Chess.com Colors */
        .white-1e1d7 { background-color: #ebecd0 !important; }
        .black-3c85d { background-color: #779556 !important; }

        /* HIGHLIGHTS - Using !important to force them over the board colors */
        .highlight-yellow {
            box-shadow: inset 0 0 3px 3px rgba(255, 255, 0, 0.75) !important;
            background-color: rgba(255, 255, 0, 0.4) !important;
        }

        .highlight-red {
            background-color: rgba(255, 0, 0, 0.7) !important;
        }

        /* Legal Move Dots */
        .hint-dot {
            position: relative;
        }
        .hint-dot::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 25%; height: 25%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            z-index: 10;
        }

        #status { margin-bottom: 15px; font-size: 1.2rem; background: #312e2b; padding: 5px 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="status">White to move</div>
    <div id="myBoard"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
