<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Waguri Chess</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground/assets/chessground.base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground/assets/chessground.brown.css">
    
    <style>
        :root { --bg: #312e2b; }
        body { background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        
        .profile { width: 100%; max-width: 400px; display: flex; align-items: center; padding: 10px; box-sizing: border-box; }
        .avatar { width: 35px; height: 35px; background: #555; border-radius: 4px; margin-right: 10px; }
        
        /* The Board Container */
        #board-container { width: 95vw; height: 95vw; max-width: 400px; max-height: 400px; }
        .cg-wrap { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="profile">
        <div class="avatar"></div>
        <span>Opponent (1200)</span>
    </div>

    <div id="board-container">
        <div id="chess-board"></div>
    </div>

    <div class="profile">
        <div class="avatar"></div>
        <span>Shivam (1500)</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chessground/chessground.js"></script>
    <script src="app.js"></script>
</body>
    </html>
